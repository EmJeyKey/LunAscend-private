[project]
name = "lunascend"
version = "0.2.0"
description = "Lunar mission resilience backend foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.2",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "httpx==0.28.1"]

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
